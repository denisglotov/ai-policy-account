[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "account-abstraction/=node_modules/@account-abstraction/contracts/",
    "forge-std/=node_modules/forge-std/src/"
]

[profile.ci]
fuzz = { runs = 512 }
verbosity = 2
